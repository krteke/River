[server]
listen = "127.0.0.1:8080"
# Optional. Leave empty to disable password authentication.
password = ""

[[roots]]
id = "data"
name = "Data"
path = "/mnt"

[ffmpeg]
ffmpeg_path = "/usr/bin/ffmpeg"
ffprobe_path = "/usr/bin/ffprobe"
max_concurrent_jobs = 1

[transcode]
temp_dir = "/tmp/lightfm-transcode"
idle_timeout_seconds = 90
segment_duration_seconds = 6

[hardware_transcode]
# 可选。除非服务器的 FFmpeg 构建版本和 GPU 驱动支持硬件编码，否则保持禁用。
enabled = false
# auto 会按平台尝试常见后端；也可以固定为 vaapi、nvenc、qsv、videotoolbox。
backend = "auto"
# VAAPI 常用设备。非 VAAPI 后端会忽略此项。
device = "/dev/dri/renderD128"
# speed / balanced / quality。只控制硬件编码器的速度质量倾向，码率仍由 profile 控制。
quality = "balanced"
fallback_to_software = true

[thumbnail]
cache_dir = "/tmp/river-thumbnails"
width = 320
height = 180
video_seek_seconds = 10
max_age_seconds = 604800
max_size_mb = 512
cleanup_interval_seconds = 3600

[playback]
direct_play_max_bitrate = 12000000
direct_play_max_width = 1920
direct_play_max_height = 1080
default_profile = "1080p_8m"

[[profiles]]
name = "original"
direct = true

[[profiles]]
name = "1080p_8m"
container = "hls_ts"
video_codec = "libx264"
video_profile = "high"
pixel_format = "yuv420p"
video_tag = ""
width = 1920
video_bitrate = "8000k"
audio_codec = "aac"
audio_bitrate = "160k"
audio_channels = 2
preset = "veryfast"
segment_duration = 6

[[profiles]]
name = "720p_4m"
container = "hls_ts"
video_codec = "libx264"
video_profile = "high"
pixel_format = "yuv420p"
video_tag = ""
width = 1280
video_bitrate = "4000k"
audio_codec = "aac"
audio_bitrate = "128k"
audio_channels = 2
preset = "veryfast"
segment_duration = 6

[[profiles]]
name = "hevc_1080p_5m"
# HEVC HLS 建议使用 fMP4 segment，而不是 MPEG-TS。
container = "hls_fmp4"
video_codec = "libx265"
video_profile = "main"
pixel_format = "yuv420p"
video_tag = ""
width = 1920
video_bitrate = "5000k"
audio_codec = "aac"
audio_bitrate = "160k"
audio_channels = 2
preset = "veryfast"
segment_duration = 6

[[profiles]]
name = "hevc_720p_3m"
container = "hls_fmp4"
video_codec = "libx265"
video_profile = "main"
pixel_format = "yuv420p"
video_tag = ""
width = 1280
video_bitrate = "3000k"
audio_codec = "aac"
audio_bitrate = "128k"
audio_channels = 2
preset = "veryfast"
segment_duration = 6
