[server]
listen = "127.0.0.1:8080"
# Optional. Leave empty to disable password authentication.
password = ""

[[roots]]
id = "data"
name = "Data"
path = "/mnt"

[ffmpeg]
ffmpeg_path = "/usr/bin/ffmpeg"
ffprobe_path = "/usr/bin/ffprobe"
max_concurrent_jobs = 1

[transcode]
temp_dir = "/tmp/lightfm-transcode"
idle_timeout_seconds = 90
segment_duration_seconds = 6

[hardware_transcode]
# 可选。除非服务器的 FFmpeg 构建版本和 GPU 驱动支持它，否则保持禁用。
enabled = false
# 常见示例：h264_nvenc, hevc_nvenc, h264_qsv, hevc_qsv,
# h264_vaapi, hevc_vaapi, h264_videotoolbox, hevc_videotoolbox。
video_codec = "h264_nvenc"
# VAAPI 示例：video_codec = "h264_vaapi" 或 "hevc_vaapi", device = "/dev/dri/renderD128"。
device = "/dev/dri/renderD128"
# 留空时会根据 video_codec 选择默认 filter；h264_vaapi 会使用 scale_vaapi。
video_filter = ""
# 留空时会根据 video_codec 选择默认输入参数；h264_vaapi 会自动添加 -vaapi_device/-hwaccel。
input_args = []
# NVENC 示例：
# output_args = ["-preset", "p4", "-profile:v", "high", "-pix_fmt", "yuv420p"]
output_args = []
fallback_to_software = true

[thumbnail]
cache_dir = "/tmp/river-thumbnails"
width = 320
height = 180
video_seek_seconds = 10
max_age_seconds = 604800
max_size_mb = 512
cleanup_interval_seconds = 3600

[playback]
direct_play_max_bitrate = 12000000
direct_play_max_width = 1920
direct_play_max_height = 1080
default_profile = "1080p_8m"

[[profiles]]
name = "1080p_8m"
container = "hls_ts"
video_codec = "libx264"
hardware_video_codec = ""
video_profile = "high"
pixel_format = "yuv420p"
video_tag = ""
width = 1920
video_bitrate = "8000k"
audio_codec = "aac"
audio_bitrate = "160k"
audio_channels = 2
preset = "veryfast"
segment_duration = 6

[[profiles]]
name = "720p_4m"
container = "hls_ts"
video_codec = "libx264"
hardware_video_codec = ""
video_profile = "high"
pixel_format = "yuv420p"
video_tag = ""
width = 1280
video_bitrate = "4000k"
audio_codec = "aac"
audio_bitrate = "128k"
audio_channels = 2
preset = "veryfast"
segment_duration = 6

[[profiles]]
name = "hevc_1080p_5m"
# HEVC HLS 建议使用 fMP4 segment，而不是 MPEG-TS。
container = "hls_fmp4"
video_codec = "libx265"
# VAAPI 示例。NVIDIA 可改为 hevc_nvenc；不填则使用 [hardware_transcode].video_codec。
hardware_video_codec = "hevc_vaapi"
video_profile = "main"
pixel_format = "yuv420p"
video_tag = "hvc1"
width = 1920
video_bitrate = "5000k"
audio_codec = "aac"
audio_bitrate = "160k"
audio_channels = 2
preset = "veryfast"
segment_duration = 6

[[profiles]]
name = "hevc_720p_3m"
container = "hls_fmp4"
video_codec = "libx265"
hardware_video_codec = "hevc_vaapi"
video_profile = "main"
pixel_format = "yuv420p"
video_tag = "hvc1"
width = 1280
video_bitrate = "3000k"
audio_codec = "aac"
audio_bitrate = "128k"
audio_channels = 2
preset = "veryfast"
segment_duration = 6
